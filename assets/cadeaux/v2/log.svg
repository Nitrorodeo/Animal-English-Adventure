<svg xmlns="http://www.w3.org/2000/svg" viewBox="29 0 319 190">
<defs>
<linearGradient id="log-bark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b8804a"/><stop offset=".35" stop-color="#8e5a30"/><stop offset=".8" stop-color="#5e3820"/><stop offset="1" stop-color="#4a2a1c"/></linearGradient>
<linearGradient id="log-hi" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8b27a" stop-opacity=".7"/><stop offset="1" stop-color="#e8b27a" stop-opacity="0"/></linearGradient>
<linearGradient id="log-rim" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffc58a" stop-opacity=".7"/><stop offset="1" stop-color="#ffc58a" stop-opacity="0"/></linearGradient>
<linearGradient id="log-sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3a2014" stop-opacity="0"/><stop offset=".7" stop-color="#3a2014" stop-opacity="0"/><stop offset="1" stop-color="#3a2014" stop-opacity=".35"/></linearGradient>
<radialGradient id="log-cut" cx="40%" cy="38%" r="75%"><stop offset="0" stop-color="#fde6b4"/><stop offset=".55" stop-color="#f0c27c"/><stop offset="1" stop-color="#cf9150"/></radialGradient>
<radialGradient id="log-lf" cx="30%" cy="25%" r="85%"><stop offset="0" stop-color="#b6e05a"/><stop offset=".6" stop-color="#5faa34"/><stop offset="1" stop-color="#2f7a2a"/></radialGradient>
<filter id="log-grain" x="0" y="0" width="1" height="1"><feTurbulence type="fractalNoise" baseFrequency=".02 .22" numOctaves="3" seed="4" result="n"/><feColorMatrix in="n" type="matrix" values="0 0 0 0 .2  0 0 0 0 .1  0 0 0 0 .05  0 0 0 -1.6 1.0"/><feComposite in2="SourceGraphic" operator="in"/></filter>
<filter id="log-rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".06" numOctaves="2" seed="2" result="t"/><feDisplacementMap in="SourceGraphic" in2="t" scale="6"/></filter>
<filter id="log-blur"><feGaussianBlur stdDeviation="3"/></filter>
<path id="log-body" d="M60,50 L300,50 L300,190 L60,190 C22,190 22,50 60,50Z"/>
<clipPath id="log-bc"><use href="#log-body"/></clipPath>
<clipPath id="log-cc"><ellipse cx="300" cy="120" rx="44" ry="70"/></clipPath>
</defs>
<g filter="url(#log-rough)">
<use href="#log-body" fill="url(#log-bark)"/>
<use href="#log-body" fill="url(#log-sh)"/>
</g>
