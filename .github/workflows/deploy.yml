# Construit le jeu, lance les tests et le publie sur GitHub Pages à chaque envoi sur main.
# Réglage à faire une fois : Settings → Pages → Source : « GitHub Actions ».
name: Publier le jeu

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # version en ligne : code d'accès, aucun envoi vers l'ordinateur de la maison (src/engine/access.ts)
          VITE_STATIC_SITE: '1'
          # partie partagée entre appareils (cloud/LISEZ_MOI.md) ; vide = désactivée
          VITE_CLOUD_URL: ${{ vars.CLOUD_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
